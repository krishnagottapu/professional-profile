spring:
  datasource:
    url: jdbc:h2:mem:portfolio
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: always

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailAutoConfiguration

server:
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://saikrishnagottapu.vercel.app}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Portfolio <onboarding@resend.dev>}

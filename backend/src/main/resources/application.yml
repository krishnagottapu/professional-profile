spring:
  application:
    name: portfolio-backend

  datasource:
    url: jdbc:h2:file:./data/portfolio
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin:
    email: ${ADMIN_EMAIL:krishnagottapu4@gmail.com}
  cors:
    allowed-origins: http://localhost:3000
